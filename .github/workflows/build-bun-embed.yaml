name: build-bun-embed

# Builds `libbun_embed.dylib` from the pinned, patched Bun tree and publishes it
# as a release asset so downstream consumers (e.g. KeyChord/Chord) don't have to
# spend ~20-30 minutes rebuilding Bun on every CI run.
#
# The release tag is derived from the Bun submodule commit, so a given dylib is
# immutable and cacheable: `bun-embed-<bun-sha>`.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and overwrite the release even if it already exists
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      # Only the inputs that change the dylib.
      - packages/com/github/oven-sh/bun/**
      - packages/dev/improve/rbun/configs/patching/**
      - packages/dev/improve/rbun/configs/bun/build/**
      - .github/workflows/build-bun-embed.yaml

concurrency:
  group: build-bun-embed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            macho_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            macho_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve Bun source commit
        id: bun
        run: |
          set -euo pipefail
          sha="$(git -C packages/com/github/oven-sh/bun/src rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "tag=bun-embed-${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "asset=libbun_embed-${{ matrix.arch }}-apple-darwin.dylib" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 -c 'import json; print(json.load(open("packages/com/github/oven-sh/bun/src/package.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Check whether this asset already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets="$(gh release view "${{ steps.bun.outputs.tag }}" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -Fxq "${{ steps.bun.outputs.asset }}" <<< "$assets" \
            && grep -Fxq "${{ steps.bun.outputs.asset }}.sha256" <<< "$assets"; then
            echo "asset already published; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.existing.outputs.skip != 'true' && matrix.arch == 'aarch64'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          brew update
          brew install llvm@23 automake ccache cmake coreutils gnu-sed go icu4c \
            libiconv libtool nasm ninja pkg-config ruby
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      # Homebrew no longer bottles LLVM for Intel Macs. Use conda-forge's
      # prebuilt tools so this job builds Bun rather than spending its limit
      # compiling LLVM. Keep LLVM aligned with Bun's scripts/build/ci-images/spec.ts.
      - name: Install Intel build dependencies
        id: intel
        if: steps.existing.outputs.skip != 'true' && matrix.arch == 'x86_64'
        timeout-minutes: 30
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: bun-build
          create-args: >-
            --override-channels --channel conda-forge --strict-channel-priority
            clang-23=23.1.1 llvm-tools=23.1.1
            automake ccache cmake coreutils sed go libiconv libtool nasm ninja pkg-config ruby
          init-shell: none
          generate-run-shell: false
          cache-environment: true

      - name: Configure Intel toolchain
        if: steps.existing.outputs.skip != 'true' && matrix.arch == 'x86_64'
        env:
          TOOLCHAIN: ${{ steps.intel.outputs.environment-path }}
        run: |
          set -euo pipefail
          # The versioned compiler package omits conda's default compiler config
          # and libc++ headers: Bun must use the macOS SDK's headers and libraries.
          ln -sf clang-23 "$TOOLCHAIN/bin/clang"
          ln -sf clang++-23 "$TOOLCHAIN/bin/clang++"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          echo "BUN_TOOLCHAIN_LLVM=$TOOLCHAIN" >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/clang" --version
          "$TOOLCHAIN/bin/llvm-nm" --version

      - name: Install bun
        if: steps.existing.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install rustup
        if: steps.existing.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: ccache
        if: steps.existing.outputs.skip != 'true'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: bun-embed-${{ matrix.arch }}-${{ steps.bun.outputs.short }}
          max-size: 4G
          install: "no"

      - name: Install workspace dependencies
        if: steps.existing.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Build libbun_embed
        if: steps.existing.outputs.skip != 'true'
        timeout-minutes: 120
        run: bun packages/dev/improve/rbun/configs/bun/build/_build-bun.ts --osx-deployment-target=13.0

      - name: Test embedding
        if: steps.existing.outputs.skip != 'true'
        run: cargo test --workspace

      - name: Stage asset
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          built="packages/com/github/oven-sh/bun/dist/build/release/libbun_embed.dylib"
          test -f "$built" || { echo "::error::$built was not produced"; exit 1; }
          mkdir -p out
          cp "$built" "out/${{ steps.bun.outputs.asset }}"
          # Guard against a silent arch mismatch on the runner.
          lipo -info "out/${{ steps.bun.outputs.asset }}"
          lipo -verify_arch "${{ matrix.macho_arch }}" "out/${{ steps.bun.outputs.asset }}"
          cd out
          shasum -a 256 "${{ steps.bun.outputs.asset }}" > "${{ steps.bun.outputs.asset }}.sha256"

      - name: Publish release asset
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.bun.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes="Prebuilt libbun_embed.dylib bundling Bun ${{ steps.bun.outputs.version }} (source commit ${{ steps.bun.outputs.sha }}), targeting macOS 13 or newer. Consumed by downstream builds via RBUN_BUN_LIB_DIR. SHA-256 checksums accompany each dylib."
            # The other architecture may create this release between our view
            # and create calls. Only ignore that successful race.
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "rbun — Bun ${{ steps.bun.outputs.version }}" \
              --notes "$notes" \
              --prerelease \
              || gh release view "$tag" >/dev/null
          fi
          gh release upload "$tag" "out/${{ steps.bun.outputs.asset }}" "out/${{ steps.bun.outputs.asset }}.sha256" --clobber
