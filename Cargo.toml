[workspace]
members = ["macros"]

[package]
name = "rbun"
version = "0.1.0"
edition = "2024"
description = "Embed Bun's JavaScript runtime (JavaScriptCore + Bun's event loop and module loader) in Rust, with an rquickjs-compatible API"
license = "MIT"
repository = "https://github.com/KeyChord/rbun"
links = "bun_embed"

[features]
default = ["macro"]
macro = ["dep:rbun-macros"]

[dependencies]
rbun-macros = { path = "macros", optional = true }
serde = { version = "1" }
serde_json = "1"
thiserror = "2"
libc = "0.2"

[dev-dependencies]
anyhow = "1"
approx = "0.5"
criterion = "0.8"
rquickjs = { version = "0.11", features = ["futures"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[[bench]]
name = "compare"
harness = false
