[package]
name = "rbun-macros"
version = "0.1.0"
edition.workspace = true
description = "#[rbun::class] / #[rbun::methods] — rquickjs-style class macros for rbun"
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
